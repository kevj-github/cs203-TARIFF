# ------------------------
# Default/Common Config
# ------------------------
spring:
  application:
    name: tariff-server
  profiles.active: direct

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
app:
  jwt:
    secret: myVerySecureJWTSecretKeyThatShouldBeAtLeast64CharactersLongForHS512Algorithm
    expiration: 86400000  # 24 hours in milliseconds

# ------------------------
# Dev Profile (H2 In-memory for local development)
# ------------------------
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:tariffdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop  # Clean slate each restart for dev
  flyway:
    enabled: false  # Disable for H2 development

# JWT Configuration for Dev (optional override)
app:
  jwt:
    secret: devSecretKeyThatIsLongEnoughForHS512AlgorithmToWorkProperly123456789
    expiration: 86400000

# ------------------------
# Prod Profile (Supabase PostgreSQL via Session Pooler)
# ------------------------
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.xizwjutjdldhrthleubs
    password: CS203Tariff1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10   # start small 
      minimum-idle: 2
      idle-timeout: 30000     # 30s
      max-lifetime: 600000    # 10 min
      connection-timeout: 20000 # 20s
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false  # Disable Flyway for now
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages

# JWT Configuration for Prod
app:
  jwt:
    secret: ${JWT_SECRET:prodSecretKeyThatShouldBeStoredAsEnvironmentVariableInProduction}
    expiration: 86400000  # 24 hours

