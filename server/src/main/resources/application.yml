# ------------------------
# Default/Common Config
# ------------------------
spring:
  application:
    name: tariff-server
  profiles.active: prod

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: myVerySecureJWTSecretKeyThatShouldBeAtLeast64CharactersLongForHS512Algorithm
    expiration: 86400000  # 24 hours in milliseconds

# ------------------------
# Dev Profile (H2 In-memory for local development)
# ------------------------
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:tariffdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop  # Clean slate each restart for dev
  flyway:
    enabled: false  # Disable for H2 development

# JWT Configuration for Dev (optional override)
app:
  jwt:
    secret: devSecretKeyThatIsLongEnoughForHS512AlgorithmToWorkProperly123456789
    expiration: 86400000

# ------------------------
# Prod Profile (Supabase PostgreSQL via Session Pooler)
# ------------------------
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
    username: postgres.xizwjutjdldhrthleubs
    password: jY8MbHb4bg_hij!
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false  # Disable Flyway for now

# JWT Configuration for Prod
app:
  jwt:
    secret: ${JWT_SECRET:prodSecretKeyThatShouldBeStoredAsEnvironmentVariableInProduction}
    expiration: 86400000  # 24 hours

